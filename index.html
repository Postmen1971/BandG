<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anstoß — Deine Vereine, live im Blick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1E7;
    --bg-elevated: #FFFFFF;
    --card: #FFFFFF90;
    --card-solid: #FFFFFF;
    --line: #E3DDCC;
    --turf: #1B7A4E;
    --turf-dim: #DCF0E3;
    --flood: #B4790C;
    --flood-dim: #F1E1B8;
    --live: #C93E3E;
    --text: #1C2330;
    --text-dim: #626B7A;
    --text-faint: #97A0AD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #FFFFFF 0%, #F5F1E7 55%), var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display:flex; justify-content:center;
  }
  .device{
    width:100%;
    max-width: 430px;
    min-height:100vh;
    background: var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, rgba(245,241,231,0.98) 70%, rgba(245,241,231,0.85));
    backdrop-filter: blur(10px);
    padding: 10px 16px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .brandrow{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size: 17px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .brand .dot{color:var(--flood);}
  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
  }

  nav.tabs{
    display:flex;
    gap: 4px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom: 8px;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto;
    font-family:'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    cursor:pointer;
    transition: all .15s ease;
    white-space:nowrap;
  }
  .tab.live-tab{ display:flex; align-items:center; gap:6px; }
  .tab.live-tab .pulse{
    width:6px; height:6px; border-radius:50%; background: var(--live);
    box-shadow: 0 0 0 0 rgba(225,76,76,0.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(225,76,76,.55);}
    70%{box-shadow:0 0 0 6px rgba(225,76,76,0);}
    100%{box-shadow:0 0 0 0 rgba(225,76,76,0);}
  }
  .tab.active{
    background: var(--turf);
    border-color: var(--turf);
    color: #06140D;
  }

  /* ---------- Länderspiel banner ---------- */
  .natl-banner{
    margin: 10px 16px 0 16px;
    padding: 7px 12px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(180,121,12,0.12), rgba(180,121,12,0.02));
    border: 1px solid var(--flood-dim);
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 10.5px;
    line-height:1.3;
    color: #7A5714;
  }
  .natl-banner b{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.3px; text-transform:uppercase; font-size:10px; }

  /* ---------- Main list ---------- */
  main{ padding: 8px 16px 90px 16px; flex:1; }

  .day-heading{
    font-family:'Oswald', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 14px 2px 6px 2px;
    display:flex; align-items:center; gap:8px;
  }
  .day-heading:first-child{ margin-top:2px; }
  .day-heading::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .match-card{
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 8px 7px 11px;
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    gap: 8px;
    position:relative;
    transition: border-color .15s ease;
    box-shadow: 0 1px 2px rgba(28,35,48,0.05);
  }
  .match-card.is-live{
    border-color: rgba(201,62,62,0.45);
    background: linear-gradient(180deg, rgba(201,62,62,0.06), var(--card-solid) 40%);
  }
  .match-card .comp-strip{
    position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:3px;
    background: var(--turf);
  }
  .match-card.comp-cl .comp-strip{ background: #3D6FE0; }
  .match-card.comp-natl .comp-strip{ background: var(--flood); }
  .match-card.comp-pokal .comp-strip{ background: #B45FE0; }

  .mc-time{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:600;
    color: var(--text-dim);
    width: 34px;
    text-align:center;
    flex-shrink:0;
    line-height:1.1;
  }
  .mc-time small{ display:block; font-size:8px; color:var(--text-faint); font-weight:500; margin-top:1px;}
  .mc-time.live-time{ color: var(--live); }
  .mc-time.live-time small{ color: var(--live); }

  .mc-body{ flex:1; min-width:0; }
  .mc-teams{
    font-family:'Oswald', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    display:flex; align-items:center; gap:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.25;
  }
  .mc-teams .vs{ color: var(--text-faint); font-size:9.5px; font-weight:400;}
  .mc-comp{
    font-size: 9.5px;
    color: var(--text-dim);
    margin-top: 1px;
    display:flex; align-items:center; gap:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mc-comp .fav-flag{ font-size:9.5px; }

  .mc-score{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 13px;
    color: var(--live);
    width: 28px;
    text-align:center;
    flex-shrink:0;
  }

  .tv-btn{
    flex-shrink:0;
    width: 28px; height:28px;
    border-radius: 8px;
    background: rgba(180,121,12,0.08);
    border: 1px solid var(--flood-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .tv-btn:active{ transform: scale(0.92); background: rgba(180,121,12,0.18); }
  .tv-btn svg{ width:14px; height:14px; stroke: var(--flood); }
  .tv-btn.no-data{ opacity:0.35; pointer-events:none; }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-faint);
  }
  .empty-state .icon{ font-size:32px; margin-bottom:10px; }
  .empty-state .title{ font-family:'Oswald',sans-serif; font-size:15px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px;}

  /* ---------- Bottom fav strip ---------- */
  .fav-strip{
    position:sticky; bottom:0; z-index:15;
    background: linear-gradient(0deg, rgba(245,241,231,0.98) 75%, rgba(245,241,231,0.7));
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 7px 12px calc(7px + env(safe-area-inset-bottom)) 12px;
    display:flex;
    gap: 8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .fav-strip::-webkit-scrollbar{display:none;}
  .fav-chip{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width: 38px;
    opacity: 0.5;
    transition: opacity .15s ease;
  }
  .fav-chip.selected{ opacity:1; }
  .fav-chip .crest{
    width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    background: var(--bg-elevated);
    border: 1.5px solid var(--line);
    box-shadow: 0 1px 2px rgba(28,35,48,0.06);
  }
  .fav-chip.selected .crest{ border-color: var(--turf); }
  .fav-chip .fname{ font-size:8.5px; color:var(--text-faint); letter-spacing:.2px; text-align:center; line-height:1.1;}
  .fav-chip.selected .fname{ color: var(--text-dim); }

  /* ---------- TV Popup ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100;
    background: rgba(28,22,10,0.4);
    backdrop-filter: blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .device .overlay{ position:absolute; }

  .tv-sheet{
    width:100%; max-width:430px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-bottom:none;
    border-radius: 20px 20px 0 0;
    max-height: 82vh;
    display:flex; flex-direction:column;
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.9,.25,1);
    box-shadow: 0 -8px 30px rgba(28,22,10,0.12);
  }
  .overlay.open .tv-sheet{ transform: translateY(0); }

  .tv-sheet .grabber{ width:36px; height:4px; background:var(--line); border-radius:3px; margin:10px auto 4px auto;}

  .tv-sheet header{
    padding: 12px 18px 14px 18px;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .tv-sheet .tv-title{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--flood); margin-bottom:3px;}
  .tv-sheet .tv-match{ font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; }
  .tv-sheet .tv-meta{ font-size:11px; color:var(--text-faint); margin-top:2px;}
  .tv-close{
    width:30px; height:30px; border-radius:50%;
    background: var(--bg); border:1px solid var(--line);
    color: var(--text-dim); font-size:15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; margin-left:10px;
  }

  .tv-list{ overflow-y:auto; padding: 6px 0 18px 0; }
  .tv-group{ padding: 12px 18px 4px 18px; }
  .tv-group-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-faint);
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .tv-group-label::after{ content:""; flex:1; height:1px; background:var(--line);}
  .tv-channel{
    display:flex; align-items:center; gap:12px;
    padding: 9px 6px;
    border-radius:10px;
  }
  .tv-channel + .tv-channel{ border-top: 1px solid #EDE8DB; }
  .tv-flag{ font-size:20px; width:26px; text-align:center; flex-shrink:0;}
  .tv-chan-name{ font-size:13.5px; font-weight:600; color:var(--text);}
  .tv-chan-country{ font-size:10.5px; color:var(--text-faint); margin-top:1px;}
  .tv-chan-tag{
    margin-left:auto;
    font-size: 9px;
    font-family:'JetBrains Mono',monospace;
    padding: 3px 7px;
    border-radius:5px;
    background: var(--turf-dim);
    color: #146239;
    flex-shrink:0;
  }
  .tv-chan-tag.ppv{ background: #FBE3C7; color:#8A4B12; }

  footer.credit{
    text-align:center;
    font-size:10px;
    color: var(--text-faint);
    padding: 10px 0 4px 0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

    return `<div class="fav-chip selected">
      <div class="crest">${t.crest}</div>
      <div class="fname">${t.short}</div>
    </div>`;
  }).join('');
}

function matchRow(m){
  const hasTv = Object.values(m.tv).some(arr => arr.length);
  let timeBlock, teamsBlock, scoreBlock = '';

  if(m.status === 'national'){
    timeBlock = `<div class="mc-time">${m.time}<small>${m.date}</small></div>`;
    teamsBlock = `<div class="mc-teams">${FLAGS[m.flagA]||''} ${m.nameA} <span class="vs">–</span> ${m.nameB} ${FLAGS[m.flagB]||''}</div>`;
  } else {
    timeBlock = m.status === 'live'
      ? `<div class="mc-time live-time">${m.minute}<small>LIVE</small></div>`
      : `<div class="mc-time">${m.time}<small>${m.date}</small></div>`;
    teamsBlock = `<div class="mc-teams">${teamCrest(m.home)} ${teamLabel(m.home)} <span class="vs">vs</span> ${teamLabel(m.away)} ${teamCrest(m.away)}</div>`;
    if(m.status === 'live'){
      scoreBlock = `<div class="mc-score">${m.scoreA}:${m.scoreB}</div>`;
    }
  }

  return `
  <div class="match-card ${m.compClass} ${m.status==='live' ? 'is-live':''}" data-id="${m.id}">
    <div class="comp-strip"></div>
    ${timeBlock}
    <div class="mc-body">
      ${teamsBlock}
      <div class="mc-comp">${m.fav ? '<span class="fav-flag">★</span>' : ''}${m.comp}</div>
    </div>
    ${scoreBlock}
    <div class="tv-btn ${hasTv ? '' : 'no-data'}" data-tv="${m.id}" aria-label="TV-Sender anzeigen">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="13" rx="2"/>
        <path d="M8 3l4 4 4-4"/>
      </svg>
    </div>
  </div>`;
}

function groupByDay(matches){
  const order = [];
  const map = {};
  matches.forEach(m => {
    if(!map[m.day]){ map[m.day] = []; order.push(m.day); }
    map[m.day].push(m);
  });
  return order.map(day => ({day, items: map[day]}));
}

function render(){
  let data = MATCHES;
  const natlBanner = document.getElementById('natlBanner');

  if(activeTab === 'heute'){
    data = MATCHES.filter(m => m.day === 'Heute');
    natlBanner.style.display = 'none';
  } else if(activeTab === 'live'){
    data = MATCHES.filter(m => m.status === 'live');
    natlBanner.style.display = 'none';
  } else if(activeTab === 'favoriten'){
    data = MATCHES.filter(m => m.fav);
    natlBanner.style.display = 'none';
  } else if(activeTab === 'natl'){
    data = MATCHES.filter(m => m.status === 'national');
    natlBanner.style.display = 'none';
  } else {
    natlBanner.style.display = 'flex';
  }

  if(data.length === 0){
    main.innerHTML = `<div class="empty-state">
      <div class="icon">⚽</div>
      <div class="title">Keine Spiele</div>
      <div>Für diesen Bereich stehen aktuell keine Begegnungen an.</div>
    </div>`;
    return;
  }

  const groups = groupByDay(data);
  main.innerHTML = groups.map(g => `
    <div class="day-heading">${g.day}</div>
    ${g.items.map(matchRow).join('')}
  `).join('');
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  render();
});

/* ---------------- TV Popup ---------------- */
const overlay = document.getElementById('overlay');
const tvList = document.getElementById('tvList');
const tvMatchTitle = document.getElementById('tvMatchTitle');
const tvMatchMeta = document.getElementById('tvMatchMeta');

function openTv(id){
  const m = MATCHES.find(mm => mm.id === Number(id));
  if(!m) return;
  const title = m.status === 'national' ? `${m.nameA} – ${m.nameB}` : `${teamLabel(m.home)} – ${teamLabel(m.away)}`;
  tvMatchTitle.textContent = title;
  tvMatchMeta.textContent = `${m.comp} · ${m.date}, ${m.time} Uhr`;

  let html = '';
  LANG_GROUPS.forEach(g => {
    const chans = m.tv[g.key] || [];
    if(!chans.length) return;
    html += `<div class="tv-group">
      <div class="tv-group-label">${g.label}</div>
      ${chans.map(ch => `
        <div class="tv-channel">
          <div class="tv-flag">${FLAGS[countryFlag(ch.country)] || flagFromName(ch.country)}</div>
          <div>
            <div class="tv-chan-name">${ch.c}</div>
            <div class="tv-chan-country">${ch.country}</div>
          </div>
          ${ch.tag ? `<div class="tv-chan-tag ${ch.tag==='PPV'?'ppv':''}">${ch.tag}</div>` : ''}
        </div>
      `).join('')}
    </div>`;
  });
  if(!html){
    html = `<div class="empty-state"><div class="icon">📡</div><div class="title">Keine Senderdaten</div><div>Für dieses Spiel liegen noch keine TV-Infos vor.</div></div>`;
  }
  tvList.innerHTML = html;
  overlay.classList.add('open');
}

function countryFlag(name){
  const map = {"Deutschland":"DE","Türkei":"TR","Großbritannien":"EN","Frankreich":"FR","Spanien":"ES","Italien":"IT","USA":"US","Katar":"QA","Saudi-Arabien":"SA","Niederlande":"NL"};
  return map[name];
}
function flagFromName(name){
  const code = countryFlag(name);
  return code ? FLAGS[code] : "🌍";
}

main.addEventListener('click', e => {
  const tvBtn = e.target.closest('.tv-btn');
  if(tvBtn && !tvBtn.classList.contains('no-data')){
    openTv(tvBtn.dataset.tv);
  }
});

document.getElementById('tvClose').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if(e.target === overlay) overlay.classList.remove('open'); });

/* ---------------- Init ---------------- */
renderFavStrip();
render();
</script>
</body>
</html>
